services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parking
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/02-init-data.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/parking
      # 現在は実証用センサー1台を監視。値はホスト側の環境変数で差し替え可能
      SENSOR_API_URL: ${SENSOR_API_URL:-http://192.168.120.238:3000/status}
      TARGET_SENSOR_ID: ${TARGET_SENSOR_ID:-1}
      TARGET_DEVICE_ID: ${TARGET_DEVICE_ID:-SENSOR_UP_001}
      # 以下は開発用の既定値。本番環境では必ず安全な値へ変更する
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-pbkdf2_sha256:600000:park-now-dev:496edc52ada195ac4ece176a317d5a651d872e96c0ab3161bbf5508ec5aa5111}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-secret-in-production}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # フロントエンドの認証対応後に true へ変更する
      AUTHORIZATION_ENABLED: ${AUTHORIZATION_ENABLED:-false}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # ブラウザ(クライアント側)からのアクセス用。ホストマシンに公開されたポートを指す
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # サーバーコンポーネント(Next.jsサーバー = このコンテナ自身)からのアクセス用。
      # docker-composeネットワーク上のサービス名で名前解決する
      API_INTERNAL_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  db_data:
